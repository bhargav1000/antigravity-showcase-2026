<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUS Antigravity Hackathon - bhargav1000</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #090d16 0%, #111827 50%, #1e1b4b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 640px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 40px rgba(56, 189, 248, 0.1);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 1rem;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 9999px;
      margin-bottom: 1.75rem;
      letter-spacing: 0.025em;
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 1.1rem;
      color: #94a3b8;
      font-weight: 400;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .footer-info {
      padding-top: 1.75rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.85rem;
      color: #64748b;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .footer-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .footer-item span:first-child {
      color: #94a3b8;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .footer-item span:last-child {
      color: #cbd5e1;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Status: Initial Environment Verification Passed ✅</div>
    <h1>Hi NUS Antigravity Hackathon! I am bhargav1000</h1>
    <p class="subtitle">NUS MSBA Build with Antigravity Hands-on Lab (2026-11-23)</p>
    <div class="footer-info">
      <div class="footer-item">
        <span>Track</span>
        <span>Track 3: HDB Resale</span>
      </div>
      <div class="footer-item">
        <span>Branch</span>
        <span>feat/bhargav1000-hdb-resale</span>
      </div>
      <div class="footer-item">
        <span>Author</span>
        <span>@bhargav1000</span>
      </div>
    </div>
  </div>
</body>
</html>
